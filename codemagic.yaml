workflows:
  ios-unsigned:
    name: ModSuite Companion iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Flutter dependencies
        script: flutter pub get

      - name: Analyze Flutter code
        script: flutter analyze

      - name: Run Flutter tests
        script: |
          if [ -d test ] && find test -name '*_test.dart' | grep -q .; then
            flutter test
          else
            echo "No Flutter tests found yet; skipping."
          fi

      - name: Build iOS without code signing
        script: flutter build ios --simulator --debug

    artifacts:
      - build/ios/iphonesimulator/Runner.app/**

